name: Deploy

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    needs: [quality-gates]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      contents: write
      id-token: write

    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      REPO_NAME: ${{ vars.REPO_NAME }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      PULUMI_STACK: ${{ vars.PULUMI_STACK }}
      PULUMI_STATE_BUCKET: ${{ vars.PULUMI_STATE_BUCKET }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE || '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix infra/pulumi ci

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Pulumi CLI
        uses: pulumi/actions@v6

      - name: Conditional First-Run Infrastructure Bootstrap
        id: conditional-bootstrap
        run: |
          if ! gcloud artifacts repositories describe "$REPO_NAME" \
            --location="$REGION" \
            --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Artifact Registry repository $REPO_NAME not found. Executing initial bootstrap pulumi up..."
            pulumi login "$PULUMI_STATE_BUCKET"
            pulumi stack select --create "$PULUMI_STACK" --cwd ./infra/pulumi
            pulumi up --yes --cwd ./infra/pulumi --stack "$PULUMI_STACK"
          else
            echo "Artifact Registry repository $REPO_NAME exists. Skipping pre-Docker bootstrap pass."
          fi

      - name: Configure Docker Authentication for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker Image with Version Tags
        id: build-image
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${REPO_NAME}"
          IMAGE_SHA_TAG="${IMAGE_PATH}:${GITHUB_SHA}"
          IMAGE_LATEST="${IMAGE_PATH}:latest"

          TAG_ARGS=("-t" "$IMAGE_SHA_TAG" "-t" "$IMAGE_LATEST")
          if [ "$DEPLOY_ENV" = "prod" ]; then
            IMAGE_VERSION_TAG="${IMAGE_PATH}:v${PACKAGE_VERSION}"
            TAG_ARGS+=("-t" "$IMAGE_VERSION_TAG")
            echo "IMAGE_VERSION_TAG=$IMAGE_VERSION_TAG" >> $GITHUB_ENV
          fi

          docker build "${TAG_ARGS[@]}" .

          echo "IMAGE_SHA_TAG=$IMAGE_SHA_TAG" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Push Docker Image
        run: |
          docker push "$IMAGE_SHA_TAG"
          docker push "$IMAGE_LATEST"
          if [ "$DEPLOY_ENV" = "prod" ]; then
            docker push "$IMAGE_VERSION_TAG"
          fi

      - name: Deploy App to Cloud Run
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ vars.PULUMI_STACK }}
          work-dir: ./infra/pulumi
          cloud-url: ${{ vars.PULUMI_STATE_BUCKET }}
          upsert: true
          config-map: |
            image:
              value: ${{ env.IMAGE_SHA_TAG }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE || '' }}

      - name: Get Cloud Run URL from Pulumi
        id: pulumi-output
        run: |
          SERVICE_URL=$(pulumi stack output serviceUrl --cwd ./infra/pulumi -s "$PULUMI_STACK")
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Mint OIDC Identity Token for Smoke Test
        id: smoke-id-token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'id_token'
          id_token_audience: ${{ env.SERVICE_URL }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Generate Google Workspace Add-on Manifest
        run: |
          npm run generate:manifest -- --service-url "$SERVICE_URL" --environment "$DEPLOY_ENV"

      - name: Deploy Google Workspace Add-on Manifest
        run: |
          if gcloud workspace-add-ons deployments describe "$REPO_NAME" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Workspace Add-on deployment $REPO_NAME exists. Running deployments replace..."
            gcloud workspace-add-ons deployments replace "$REPO_NAME" \
              --deployment-file=infra/deployment.json \
              --project="$PROJECT_ID"
          else
            echo "Workspace Add-on deployment $REPO_NAME does not exist. Running deployments create..."
            gcloud workspace-add-ons deployments create "$REPO_NAME" \
              --deployment-file=infra/deployment.json \
              --project="$PROJECT_ID"
          fi

      - name: Verify Deployment Readiness (Smoke Test)
        env:
          OIDC_ID_TOKEN: ${{ steps.smoke-id-token.outputs.id_token }}
        run: |
          npm run verify:deployment -- \
            --service-url "$SERVICE_URL" \
            --service-name "$SERVICE_NAME" \
            --region "$REGION" \
            --project-id "$PROJECT_ID" \
            --repo-name "$REPO_NAME"

      - name: Publish GitHub Release on Main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_VERSION="${PACKAGE_VERSION:-$(node -p "require('./package.json').version")}"
          RELEASE_TAG="v${PACKAGE_VERSION}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping release creation."
            exit 0
          fi

          gh release create "$RELEASE_TAG" --target "${GITHUB_SHA}" --title "$RELEASE_TAG" --generate-notes

