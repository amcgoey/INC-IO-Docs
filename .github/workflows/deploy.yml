name: Deploy to Google Cloud Run (Dev)

on:
  push:
    branches:
      - develop

env:
  PROJECT_ID: inc-io-docs-dev
  REGION: us-east4
  REPO_NAME: inc-io-docs
  SERVICE_NAME: inc-io-docs-dev
  PULUMI_STATE_BUCKET: gs://inc-io-docs-dev-pulumi-state

jobs:
  build-and-deploy:
    name: Build, Push, & Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix infra/pulumi ci

      - name: Run Tests and Typecheck
        run: |
          npm run typecheck
          npm test

      - name: Build Docker Image (Local)
        id: build-image
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}"
          IMAGE_TAG="${IMAGE_PATH}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_PATH}:latest"

          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Bootstrap Image for Base Service
        id: resolve-bootstrap-image
        run: |
          BOOTSTRAP_IMAGE=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --format="value(spec.template.spec.containers[0].image)" 2>/dev/null || true)

          if [ -z "$BOOTSTRAP_IMAGE" ]; then
            BOOTSTRAP_IMAGE="us-docker.pkg.dev/cloudrun/container/hello"
          fi

          echo "BOOTSTRAP_IMAGE=$BOOTSTRAP_IMAGE" >> $GITHUB_ENV

      - name: Provision Infrastructure (Artifact Registry & Base Service)
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: ./infra/pulumi
          cloud-url: ${{ env.PULUMI_STATE_BUCKET }}
          upsert: true
          config-map: |
            image:
              value: ${{ env.BOOTSTRAP_IMAGE }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE || '' }}

      - name: Configure Docker Authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Push Docker Image
        run: |
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy App to Cloud Run
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: ./infra/pulumi
          cloud-url: ${{ env.PULUMI_STATE_BUCKET }}
          upsert: true
          config-map: |
            image:
              value: ${{ env.IMAGE_TAG }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE || '' }}

      - name: Get Cloud Run URL from Pulumi
        id: pulumi-output
        run: |
          # Fetch the Cloud Run URL that Pulumi just provisioned
          # We export this from Pulumi so we need to grab it from the stack
          SERVICE_URL=$(pulumi stack output serviceUrl --cwd ./infra/pulumi -s dev)
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE || '' }}

      - name: Generate Google Workspace Add-on Manifest
        run: |
          npm run generate:manifest -- --service-url "$SERVICE_URL" --environment dev

      - name: Deploy Google Workspace Add-on Manifest
        run: |
          # The deployment name is the resource identifier in GCP
          gcloud workspace-add-ons deployments replace ${{ env.REPO_NAME }} \
            --deployment-file=infra/deployment.json \
            --project=${{ env.PROJECT_ID }}
