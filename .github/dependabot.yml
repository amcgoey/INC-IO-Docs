version: 2
updates:
  # Maintain GitHub actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Maintain root Node dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Maintain Pulumi infrastructure dependencies
  - package-ecosystem: "npm"
    directory: "/infra/pulumi"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-infra)"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
