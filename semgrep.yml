.import_patterns: &import_patterns
  - pattern: import $X from '$MODULE'
  - pattern: import { ... } from '$MODULE'
  - pattern: import * as $X from '$MODULE'
  - pattern: import type { ... } from '$MODULE'
  - pattern: import type $X from '$MODULE'
  - pattern: import '$MODULE'
  - pattern: require('$MODULE')
  - pattern: import('$MODULE')

rules:
  # =========================================================================
  # STRICT RULES (ERROR)
  # =========================================================================

  # 1. Hexagonal Dependency Inversion - Domain Purity
  - id: hex-domain-purity
    message: "Domain models and ports must not import external libraries (except Typebox), adapters, or infrastructure modules."
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include: 
        - "**/src/features/**/domain.ts"
        - "**/src/features/**/ports.ts"
    patterns:
      - pattern-either: *import_patterns
      - metavariable-regex:
          metavariable: $MODULE
          regex: '^(?!(\.|@sinclair/typebox)).*$|.*adapters.*|.*infrastructure.*'

  # 2. Hexagonal Wiring - Infrastructure Injection
  - id: hex-infrastructure-injection
    message: "Infrastructure modules must only be injected/imported into the src/app/ wiring layer and never into src/features/."
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      exclude:
        - "**/src/app/**"
        - "**/src/infrastructure/**"
        - "**/test/**"
        - "**/*.test.ts"
        - "**/infra/**"
        - "**/src/features/**/adapters/**"
    patterns:
      - pattern-either: *import_patterns
      - metavariable-regex:
          metavariable: $MODULE
          regex: '.*infrastructure.*'

  # 3. Hexagonal Isolation - Infrastructure Purity
  - id: hex-infrastructure-purity
    message: "Infrastructure modules must be domain-agnostic and must never import from src/features/."
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - "**/src/infrastructure/**"
    patterns:
      - pattern-either: *import_patterns
      - metavariable-regex:
          metavariable: $MODULE
          regex: '.*features.*'

  # 4. Fastify/Cloud Run Security - Basic Hardcoded Secrets
  - id: hardcoded-secrets
    message: "Potential hardcoded secret or API key detected. Do not check secrets into source control."
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern-either:
          - pattern: const $KEY = "..."
          - pattern: $KEY = "..."
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i).*(api_key|token|secret|password).*'

  # 5. Fastify/Cloud Run Security - Unhandled Promise
  - id: fastify-unhandled-promise
    message: "Fastify controllers must handle promises properly to prevent unhandled rejections from crashing the Cloud Run container."
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern-either:
          - pattern-inside: fastify.$METHOD(..., async (...) => { ... })
          - pattern-inside: fastify.$METHOD(..., (...) => { ... })
      - pattern: $X(...)
      - pattern-not: await $X(...)
      - pattern-not: return $X(...)

  # 6. Handlebars Logic Bans
  - id: handlebars-logic-ban
    message: "Boolean logic, branching, and complex formatting are banned in Handlebars for this architecture."
    severity: ERROR
    languages: [json, yaml]
    patterns:
      - pattern-regex: '\{\{#(if|each|unless|with)'

  # 7. JSON Schema Hardcoding
  - id: no-hardcoded-recordtype
    message: "Do not hardcode RecordType configurations in TypeScript. They must be runtime-interpreted JSON files."
    severity: ERROR
    languages: [typescript]
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/test/**"
    patterns:
      - pattern: "const $X : RecordType = { ... }"

  # =========================================================================
  # MODERATE RULES (WARNING) - Loosened during prototyping
  # =========================================================================

  # 8. Hexagonal Isolation (Currently WARNING, to be tightened to ERROR later)
  - id: hexagonal-isolation-warning
    message: "Domain logic / Actions should not bypass ports to access implementations directly."
    severity: WARNING
    languages: [typescript]
    paths:
      exclude:
        - "**/src/features/**/adapters/**"
        - "**/src/app/**"
        - "**/*.test.ts"
        - "**/test/**"
    patterns:
      - pattern: "new $ADAPTER(...)"
      - metavariable-regex:
          metavariable: $ADAPTER
          regex: '.*Adapter$'

  # 9. Adapter Leakage (Currently WARNING, to be tightened to ERROR later)
  - id: adapter-leakage-warning
    message: "External SDKs (Google Drive, Gmail, Fastify) should only be imported within designated adapter folders or the app wiring layer."
    severity: WARNING
    languages: [typescript]
    paths:
      exclude:
        - "**/src/features/**/adapters/**"
        - "**/src/app/**"
        - "**/src/infrastructure/**"
    patterns:
      - pattern-either: *import_patterns
      - metavariable-regex:
          metavariable: $MODULE
          regex: '(googleapis|fastify|@fastify/.*)'

  # 10. Testing Locality - Prevent Test Imports in Core Source
  - id: prevent-test-imports-in-src
    message: "Core source code must not import from the test/ directory. Unit tests should be co-located next to subjects."
    severity: WARNING
    languages: [typescript]
    paths:
      include:
        - "**/src/**"
      exclude:
        - "**/*.test.ts"
        - "**/*.test.js"
    patterns:
      - pattern-either: *import_patterns
      - metavariable-regex:
          metavariable: $MODULE
          regex: '.*test/.*'

  # 11. Testing Locality - Unit Test Co-location
  - id: unit-test-colocation
    message: "Unit tests (*.test.ts) must be co-located next to their subjects in src/. The test/ directory is reserved for E2E and integration tests."
    severity: WARNING
    languages: [typescript, javascript]
    paths:
      include:
        - "**/*.test.ts"
        - "**/*.test.js"
      exclude:
        - "**/src/**"
        - "**/test/**"
        - "**/infra/**"
    patterns:
      - pattern-either:
          - pattern: describe(...)
          - pattern: test(...)
          - pattern: it(...)

  # 13. Typebox Schema Optimization
  - id: typebox-suboptimal-schema
    message: "Avoid suboptimal Typebox schema definitions (such as Type.Any() or Type.Unsafe()) that bypass JSON schema validation and degrade type inference performance."
    severity: WARNING
    languages: [typescript, javascript]
    patterns:
      - pattern-either:
          - pattern: Type.Any(...)
          - pattern: Type.Unsafe(...)

  # =========================================================================
  # ADR 0012: Feature-Based Composition Roots
  # =========================================================================

  # 14. Ban Global DI Frameworks
  - id: ban-global-di-frameworks
    message: "Global DI frameworks are banned (ADR 0012). Use manual per-feature composition roots (e.g., src/app/<feature>.wiring.ts)."
    severity: ERROR
    languages: [typescript, javascript]
    patterns:
      - pattern-either: *import_patterns
      - metavariable-regex:
          metavariable: $MODULE
          regex: '^(inversify|tsyringe|awilix|typedi|@nestjs/common|@nestjs/core)$'

  # 15. Monolithic Wiring Ban
  - id: no-monolithic-wiring
    message: "Do not wire feature dependencies in monolithic entry points (ADR 0012). Imports from adapters are banned here; use per-feature composition roots (*.wiring.ts)."
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - "**/src/app/index.ts"
        - "**/src/app/main.ts"
        - "**/src/app/server.ts"
        - "**/src/app/bootstrap.ts"
        - "**/src/app/app.ts"
    patterns:
      - pattern-either: *import_patterns
      - metavariable-regex:
          metavariable: $MODULE
          regex: '.*adapters.*'

  # =========================================================================
  # ADR 0011: Fast-Track and Guarded Reads
  # =========================================================================

  # 16. Domain Pass-Through Reads
  - id: domain-pass-through-read
    message: "Domain models should not contain empty async pass-through methods for reads (ADR 0011). Route pure data queries directly from driving adapters to driven ports (Fast-Track Read)."
    severity: WARNING
    languages: [typescript, javascript]
    paths:
      include:
        - "**/src/features/**/domain.ts"
    patterns:
      - pattern-either:
          # Class-based pass-through (Async)
          - pattern: |
              async $METHOD(...) {
                return this.$PORT.$ANY_METHOD(...)
              }
          - pattern: |
              $METHOD(...) {
                return await this.$PORT.$ANY_METHOD(...)
              }
          # Functional pass-through (Async)
          - pattern: |
              async function $METHOD(..., $PORT, ...) {
                return $PORT.$ANY_METHOD(...)
              }
          - pattern: |
              function $METHOD(..., $PORT, ...) {
                return await $PORT.$ANY_METHOD(...)
              }
          - pattern: |
              const $METHOD = async (..., $PORT, ...) => {
                return $PORT.$ANY_METHOD(...)
              }
          - pattern: |
              const $METHOD = async (..., $PORT, ...) => $PORT.$ANY_METHOD(...)
          # Alias assignment pass-through (Kept to prevent missing edge cases)
          - patterns:
              - pattern-either:
                  - pattern: $METHOD = this.$PORT.$ANY_METHOD
                  - pattern: $METHOD = $PORT.$ANY_METHOD
              - pattern-not: $METHOD = $PORT.$ANY_METHOD as $TYPE
              - pattern-not: $METHOD = this.$PORT.$ANY_METHOD as $TYPE
      - metavariable-regex:
          metavariable: $ANY_METHOD
          regex: '^(?!has|get|set|add|delete|clear|map|filter|reduce).*$'



